name: Build and Release (Beta)

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build src/BsodDoctor -c Release --no-restore

    - name: Test
      run: dotnet run --project tests/BsodDoctor.Tests

    - name: Publish
      run: dotnet publish src/BsodDoctor -c Release --no-build -o publish

    - name: Install Inno Setup
      run: choco install innosetup --no-progress --confirm

    - name: Build Installer
      run: iscc setup\bsod-doctor.iss

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v1.0.0-build.${{ github.run_number }}" `
          --title "BSOD Doctor [Beta] v1.0.0 (Build ${{ github.run_number }})" `
          --notes "Otomatik beta derlemesi. En son master branch'inden derlenmistir." `
          --prerelease `
          artifacts\BSOD-Doctor-v1.0.0-setup.exe
