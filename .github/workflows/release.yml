name: Build and Release (Beta)

on:
  push:
    branches: [master]

permissions:
  contents: write

env:
  APP_VERSION: "0.1-beta.${{ github.run_number }}"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: |
        dotnet restore src/BsodDoctor/BsodDoctor.csproj
        dotnet restore tests/BsodDoctor.Tests/BsodDoctor.Tests.csproj

    - name: Build
      run: dotnet build src/BsodDoctor/BsodDoctor.csproj -c Release --no-restore

    - name: Test
      run: dotnet test tests/BsodDoctor.Tests/BsodDoctor.Tests.csproj --no-restore

    - name: Publish
      run: dotnet publish src/BsodDoctor/BsodDoctor.csproj -c Release --no-build -o publish

    - name: Install Inno Setup
      run: choco install innosetup --no-progress --confirm

    - name: Build Installer
      run: iscc /dMyAppVersion="$env:APP_VERSION" /dMyAppBuildNumber="${{ github.run_number }}" setup\bsod-doctor.iss

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v$env:APP_VERSION" `
          --title "BSOD Doctor Beta v$env:APP_VERSION" `
          --notes "Otomatik beta derlemesi. En son master branch'inden derlenmistir." `
          --prerelease `
          "artifacts\BSOD-Doctor-$env:APP_VERSION-setup.exe"
